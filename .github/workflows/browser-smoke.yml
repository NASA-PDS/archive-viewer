name: Browser Smoke Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:smoke
      - name: Upload browser report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
